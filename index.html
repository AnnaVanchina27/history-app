                    <h2 style="color: #2980b9; margin: 15px 0 12px; font-size: 1.15rem;">2. Новые виды деятельности</h2>
                    <div class="card">
                        <p>С изобретением <strong>деревянного плуга</strong> улучшилась обработка земли. Расширение посевной площади увеличивало урожаи, часть людей освобождалась от земледельческих работ для других занятий.</p>
                        <p>Первые <strong>ремёсла</strong> возникали постепенно. Из глины стали изготавливать сосуды — <strong>керамику</strong>. С изобретением гончарного круга изделия принимали более совершенные формы.</p>
                        <p>Люди научились обрабатывать камень, дерево, кость: пиление, шлифование, сверление. Освоили <strong>прядение и ткачество</strong>. Постепенно ткань заменила шкуры животных.</p>
                        <p>Произошло отделение от земледелия <strong>ремесла</strong> как самостоятельной деятельности. Ремесленник мог обменивать изделия на продукты. Развивается <strong>обмен</strong>, появляются <strong>торговые пути</strong>.</p>
                        <p>В <strong>4-м тысячелетии до н. э.</strong> на Востоке люди изобрели <strong>колесо</strong>. Появились первые повозки.</p>
                    </div>

                    <h2 style="color: #2980b9; margin: 15px 0 12px; font-size: 1.15rem;">3. Век металлов</h2>
                    <div class="card">
                        <p>Приблизительно в <strong>4-м тысячелетии до н. э.</strong> люди научились получать <strong>медь</strong> из руды. Период распространения медных орудий называют <strong>энеолитом</strong>.</p>
                        <p><strong>3–2-е тысячелетия до н. э.</strong> — начало <strong>бронзового века</strong>. Бронзу получали из сплава меди с другими металлами.</p>
                        <p>Способ получения <strong>железа</strong> из руды был открыт во <strong>2-м тысячелетии до н. э.</strong> С помощью железных орудий совершенствовалась обработка дерева, строительство, изготовление предметов быта. Появились новые ремёсла: кузнечное, оружейное.</p>
                    </div>

                    <h2 style="color: #2980b9; margin: 15px 0 12px; font-size: 1.15rem;">4. От родовой общины к соседской</h2>
                    <div class="card">
                        <p>Успехи в хозяйстве изменили жизнь. Поселения охотников превратились в посёлки земледельцев. Каждый член общины имел отдельный участок земли, обрабатывал его и кормил свою семью. Родовую общину сменила <strong>соседская община</strong> — коллектив семей-соседей, которые вели отдельные хозяйства.</p>
                        <p>Урожай позволял не только прокормить семью, но и получить <strong>излишки</strong>. Это повлекло за собой <strong>имущественное неравенство</strong> — появляются более состоятельные семьи.</p>
                        <p>Старейшины, вожди, шаманы сосредоточивали в своих руках руководство, организацию военного дела, проведение обрядов. Они владели лучшими наделами земли, большими стадами. Началось выделение <strong>знати</strong>. Знатные люди закрепляли за собой власть и стали передавать её по наследству.</p>
                    </div>

                    </div>

        let currentSection = null;
        let userAnswers = {};
        let chronologyOrder = {};

        function openSection(id) {
            if (!data[id]) return;
            currentSection = id;
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('section-content').classList.remove('hidden');
            document.getElementById('section-title').textContent = data[id].title;
            userAnswers = {};
            chronologyOrder = {};
            renderContent(id);
            updateProgress();
        }

        function goBack() {
            document.getElementById('main-menu').classList.remove('hidden');
            document.getElementById('section-content').classList.add('hidden');
            currentSection = null;
        }

        function renderContent(id) {
            const section = data[id];
            const area = document.getElementById('content-area');
            let html = section.explanation;

            html += `<h2 style="color: #2980b9; margin: 20px 0 12px; font-size: 1.15rem;">Проверь себя!</h2>`;

            section.questions.forEach((q, index) => {
                const qKey = `${id}-${index}`;
                const selected = userAnswers[qKey];
                const hintId = `hint-${qKey}`;
                html += `
                    <div class="question-block">
                        <div class="question-text">${q.text}</div>
                        <div class="options">
                            ${q.options.map((opt, optIndex) => {
                                let btnClass = 'option-btn';
                                if (selected !== undefined) {
                                    if (optIndex === q.correct) btnClass += ' correct';
                                    else if (optIndex === selected) btnClass += ' wrong';
                                }
                                return `<button class="${btnClass}" onclick="selectAnswer('${qKey}', ${optIndex})" ${selected !== undefined ? 'disabled' : ''}>${opt}</button>`;
                            }).join('')}
                        </div>
                        <div class="feedback ${selected !== undefined ? (selected === q.correct ? 'correct' : 'wrong') : ''}">
                            ${selected !== undefined ? (selected === q.correct ? '✅ Верно! ' + q.explanation : '❌ Неверно. ' + q.explanation) : ''}
                        </div>
                        ${q.hint ? `<button class="hint-btn" onclick="toggleHint('${hintId}')">💡 Подсказка</button>
                        <div class="hint-box" id="${hintId}">${q.hint}</div>` : ''}
                    </div>
                `;
            });

            if (section.chronology) {
                html += `<h2 style="color: #2980b9; margin: 20px 0 12px; font-size: 1.15rem;">Работаем с хронологией</h2>`;
                html += `<div class="question-block">
                    <div class="question-text">${section.chronology.question}</div>
                    <div id="chrono-list" style="display:flex; flex-direction:column; gap:6px;"></div>
                    <div class="feedback" id="chrono-feedback"></div>
                </div>`;
            }

            area.innerHTML = html;

            if (section.chronology) {
                const list = document.getElementById('chrono-list');
                const items = [...section.chronology.items];
                for (let i = items.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [items[i], items[j]] = [items[j], items[i]];
                }
                chronologyOrder[id] = [];
                items.forEach(item => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = item.name;
                    btn.dataset.id = item.id;
                    btn.onclick = () => {
                        if (chronologyOrder[id].includes(item.id)) {
                            chronologyOrder[id] = chronologyOrder[id].filter(x => x !== item.id);
                            btn.classList.remove('correct');
                        } else {
                            chronologyOrder[id].push(item.id);
                            btn.classList.add('correct');
                        }
                        checkChronology(id);
                    };
                    list.appendChild(btn);
                });
            }
        }

        function toggleHint(hintId) {
            const el = document.getElementById(hintId);
            if (el) el.classList.toggle('show');
        }

        function selectAnswer(qKey, optIndex) {
            if (userAnswers[qKey] !== undefined) return;
            userAnswers[qKey] = optIndex;
            renderContent(currentSection);
            updateProgress();
        }

        function checkChronology(id) {
            const section = data[id];
            if (!section.chronology) return;
            const correct = section.chronology.correctOrder;
            const fb = document.getElementById('chrono-feedback');
            const order = chronologyOrder[id] || [];
            if (order.length !== correct.length) {
                fb.className = 'feedback';
                fb.textContent = `Выбрано: ${order.length} из ${correct.length}`;
                return;
            }
            const isCorrect = order.every((itemId, i) => itemId === correct[i]);
            if (isCorrect) {
                fb.className = 'feedback correct';
                fb.textContent = '✅ Верно!';
            } else {
                fb.className = 'feedback wrong';
                fb.textContent = '❌ Неверно. Попробуй ещё раз!';
            }
        }

        function updateProgress() {
            const section = data[currentSection];
            const total = section.questions.length;
            const answered = section.questions.filter((_, i) => userAnswers[`${currentSection}-${i}`] !== undefined).length;
            const percent = (answered / total) * 100;
            document.getElementById('progress-fill').style.width = percent + '%';
        }

        document.getElementById('main-menu').classList.remove('hidden');
    </script>
